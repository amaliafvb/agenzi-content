name: AGENZI Code Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check frontend modules
        run: |
          node --check src/app.js
          node --check src/auth.js
          node --check src/db.js
          node --check src/supabase.js
      - name: Dependency-free security guard
        run: |
          ! grep -R "admin123\|strategy123\|copy1234\|design123" -n . --exclude-dir=.git
          ! grep -R "localStorage" -n src index.html
      - name: Verify config has no real credentials
        run: |
          grep -q "YOUR_SUPABASE_PROJECT_URL" config.js
          grep -q "YOUR_SUPABASE_PUBLISHABLE_KEY" config.js
